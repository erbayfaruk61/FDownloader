<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>FDownloader</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      color: #38bdf8;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-online { background: #10b981; }
    .dot-offline { background: #ef4444; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(18px); }
    .info {
      font-size: 11px;
      color: #94a3b8;
      line-height: 16px;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <h1>FDownloader</h1>
  </div>

  <div id="statusCard" class="status-badge status-offline">
    <div id="statusDot" class="dot dot-offline"></div>
    <span id="statusText">FDownloader Aranıyor...</span>
  </div>

  <div class="toggle-row">
    <span>İndirmeleri Otomatik Yakala</span>
    <label class="switch">
      <input type="checkbox" id="interceptToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Alt Tuşuna Basınca Pas Geç (5 sn)</span>
    <label class="switch">
      <input type="checkbox" id="bypassAltToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="info">
    .7Z, .RAR, .ZIP, .ISO, .EXE, .MP4, .MKV, çok parçalı (.001) ve tüm popüler indirmeler doğrudan FDownloader'a aktarılır.
  </div>

  <script src="popup.js"></script>
</body>
</html>
